name: ci

# Runs the tests. That sentence should be unremarkable, and until this file existed it was not true
# of any workflow here: release-dryrun.yml builds the solution and rehearses the pack without running
# a single test, and release.yml - which does run them - only fires on a tag. A suite was therefore
# verified by whoever happened to run it locally, and by nobody else.
#
# TWO TIERS, AND NEITHER IS A HALF-MEASURE. Every test runs, slow ones included; what changes is when.
#
#   * smoke - a pull request, by default. The whole solution is built in Release with warnings as
#     errors, the whole of KillMutants.Core.Tests runs, and so does the part of the end-to-end suite
#     marked [Smoke] (tests/KillMutants.EndToEnd.Tests/SmokeAttribute.cs says what earns the mark).
#     On all three platforms, because the smoke tests launch the real command line, build real
#     projects and start a test application per mutant, and each of those is only known to work on
#     the platform it ran on.
#   * full  - every push to main, a manual dispatch, and a pull request labelled `full-validation`.
#     The whole of every suite, on all three platforms: exactly what this workflow ran on every pull
#     request before the tiers existed.
#
# Why not full everywhere: measured on the hosted runners on 2026-11-07, the end-to-end suite took
# 19 min on Linux and 41 min on Windows, against 12-19 s to build and 21-46 s for the unit tests. It
# was a forty-minute wait on every one-line change, and almost all of it was sweeps that the change
# could not have reached. The price of the tiers is real and is not hidden: a regression only the
# full tier sees is found on main, after the merge. Three things bound it - the label, for a change
# that is risky before it is reviewed; `Report a red main` below, which opens an issue rather than
# leaving a red badge to be noticed; and release.yml, which refuses to publish a commit whose full
# run did not pass.
#
# Which tier ran is in each job's name and in the gate's summary, so a green `CI` never has to be
# taken on trust for more than it checked.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # The three default types, plus `labeled`: adding `full-validation` to a pull request has to start
    # a run that honours it, or the label would only take effect on the next push. Any other label
    # starts a run too, which costs one smoke run and nothing else; `unlabeled` is left out, because
    # removing the label leaves standing a verdict that checked more, not less.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

# A pull request cancels its own superseded runs; nothing that was superseded needs an answer. A push
# to main never does, and is grouped by commit so that it cannot: a group holds one running and one
# pending run, and a third push would cancel the second. Every commit on main gets its full verdict -
# which is what release.yml requires of the commit it publishes, and what says which merge broke main.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: this workflow publishes nothing and needs no write scope.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Lints the workflows, this one included. It is a job in the gate rather than a workflow of its own
  # because a broken workflow is not something to discover on the run that needed it: the failure
  # modes it catches - a mistyped `runs-on`, an expression that never evaluates, an action input that
  # does not exist - all look like a green workflow that quietly did nothing.
  #
  # It runs whether or not the repository has a solution yet, since it has nothing to do with the
  # code. On a GitHub runner actionlint also shellchecks every `run:` block, which is where its first
  # finding here came from.
  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installed from source at a pinned version rather than through a third-party action: the Go
      # module checksum database verifies what is fetched, and nothing here runs a script downloaded
      # from the internet. Runners ship Go and shellcheck; actionlint uses the latter for `run:`
      # blocks and silently skips those checks when it is absent, so it must stay installed.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint
        run: |
          set -euo pipefail
          command -v shellcheck > /dev/null || {
            echo "::error::shellcheck is not installed, so actionlint would skip every script check."
            exit 1
          }
          "$(go env GOPATH)/bin/actionlint"

  # Refuses a documentation change that leaves an English page and its French twin out of step.
  #
  # It has no `needs` and no `if`, deliberately, and that is the only thing about this job that is
  # easy to get wrong. The job below classifies `docs/` and every `*.md` as documentation and skips
  # the build - so a parity check gated on its output would skip on precisely the changes it exists
  # to see, and report green for having looked at nothing. `Lint the workflows` is the model here,
  # for the same reason: it has nothing to do with whether the code compiles.
  #
  # The script carries the reasoning - why one direction fails and the other only warns, and the
  # four things a naive version of this check gets wrong.
  translations:
    name: Check the translations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: the co-change check diffs against the base branch, and a shallow
          # clone does not have it. The script says so by name rather than failing obscurely.
          fetch-depth: 0

      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # On a push there is no pull request to compare against, so only the tree is checked.
          # Nothing is lost: the same diff was already checked on the pull request that produced it.
          tools/docs/check-translation-parity.sh "$BASE"

  # Decides whether anything worth compiling changed, so a documentation-only pull request does not
  # spend fifteen minutes of Windows proving that Markdown still parses.
  #
  # This is a job rather than a `paths-ignore:` on the workflow, and the difference is the whole
  # design. A workflow held back by a path filter does not run, so it publishes no status at all -
  # not "skipped", nothing - and a *required* check that never reports leaves a pull request blocked
  # for good. Filtering the workflow would therefore block exactly the documentation-only pull
  # requests it was added to speed up. Filtering inside it keeps `CI` reporting on every pull
  # request, whatever it contains.
  #
  # The rule is one-sided on purpose: build unless *every* changed file is documentation. Getting it
  # wrong the safe way costs fifteen minutes; getting it wrong the other way merges code nothing
  # compiled. Only pull requests are ever held back - a push to `main` always builds, because that is
  # the branch everything else is measured against.
  #
  # It also decides the tier - see the header. The default is the one that cannot be forgotten into
  # a weaker check: only a pull request is ever held to smoke, and anything else runs full.
  changes:
    name: Decide what needs building
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, so the merge base with the target branch is actually present.
          fetch-depth: 0

      # WHO DECIDES THAT A CHANGE IS RISKY. First this step, from the paths, because a rule that rests
      # on someone remembering a label is not enforced. A pull request that touches any path below
      # runs the full tier whatever its labels, on every push, so the required `CI` of its current
      # head is a full one. Each path is one whose defects the smoke tier cannot vouch for:
      #
      #   * tests/KillMutants.EndToEnd.Tests and tests/fixtures - a changed end-to-end test the smoke
      #     tier does not select would otherwise merge without ever having run, and the fixtures are
      #     the inputs every sweep builds;
      #   * the execution loop, test launch, coverage probe and process handling (Core's Execution,
      #     Testing and Coverage, and KillMutants.Platform) - the mechanisms whose platform-specific
      #     failures only the full suite reaches;
      #   * what every project is compiled with - the Directory.Build files, central package versions
      #     (a Dependabot bump of xunit, MSBuild or Roslyn is exactly such a change), global.json and
      #     the test platform's configuration - and this workflow itself, the full tier's definition.
      #
      # Then the people: for a change outside these paths that still reaches what the smoke tier
      # does not, its author or any reviewer adds `full-validation`, and the maintainer, who merges,
      # checks that the tier the gate reports is the one the change deserved. The labels are read
      # from the event, so this is the set the pull request carried when this run started; a label
      # added later starts a run of its own (`labeled`, above).
      #
      # The path list is a floor, not a ceiling: getting it wrong the safe way costs one forty-minute
      # run, the other way merges a sweep that never ran.
      - name: Decide how far to test
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          FULL_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'full-validation') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          full() {
            echo "$1; the full tier runs."
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "$EVENT" = pull_request ] || full "Not a pull request"
          [ "$FULL_REQUESTED" != true ] || full "The pull request is labelled full-validation"

          # The same three-dot, no-renames diff as the step below, for the same reasons. Read into a
          # variable first, so that a diff that fails stops the step: read through a process
          # substitution its failure would go unseen, and an empty list reads as "nothing risky".
          changed="$(git diff --no-renames --name-only "$BASE...$HEAD")"
          while IFS= read -r file; do
            case "$file" in
              tests/KillMutants.EndToEnd.Tests/*|tests/fixtures/*|\
              src/KillMutants.Core/Execution/*|src/KillMutants.Core/Testing/*|\
              src/KillMutants.Core/Coverage/*|src/KillMutants.Platform/*|\
              Directory.Build.props|Directory.Build.targets|Directory.Packages.props|global.json|\
              tests/TestCoverage.props|tests/testconfig.json|.github/workflows/ci.yml)
                full "'$file' is a path the smoke tier cannot vouch for" ;;
            esac
          done <<< "$changed"

          echo "A pull request; the smoke tier runs. Label it full-validation for the full one."
          echo "tier=smoke" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          build() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "$EVENT" = pull_request ] || build "Not a pull request; building."

          # Three dots: what this branch changed since it left the target, rather than every
          # difference between two commits - which would include whatever landed on main meanwhile.
          #
          # --no-renames matters more than it looks. Rename detection is on by default, and it
          # reports a rename as the destination path alone: moving src/C.cs to docs/C.md comes back
          # as just "docs/C.md", which reads as documentation, skips every platform, and passes the
          # gate - while a compiled source file has been deleted. Measured against git 2.43:
          # `--name-only` gives one path, `--name-status` gives `R100 src/C.cs docs/C.md`, and
          # `--no-renames` gives both paths, so the source file is classified and the build happens.
          changed="$(git diff --no-renames --name-only "$BASE...$HEAD")"

          [ -n "$changed" ] || build "No files changed; building anyway."

          echo "Changed files:"
          echo "$changed"

          # Anything not on this list builds, including .github/workflows and every build file.
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md) ;;
              *) build "'$file' is not documentation; building." ;;
            esac
          done <<< "$changed"

          echo "Documentation only; the build is not needed."
          echo "code=false" >> "$GITHUB_OUTPUT"

  # Runs on all three platforms, because this tool's whole claim is that a verdict describes the code
  # rather than the machine it was measured on - and until now that claim was only ever checked on
  # Linux. Two things it touches are decided by the operating system and cannot be tested anywhere
  # else: whether two paths differing in case name the same project (ProjectPaths), and how much of a
  # command line a filter may take before the suite runs unfiltered (XUnitTestRunner.FilterBudget,
  # whose 24 000 characters exist for a limit only Windows imposes). Both have unit tests that pass
  # the platform in as an argument; neither had ever met the real filesystem or the real limit.
  #
  # fail-fast is off deliberately. When a platform-specific defect exists, the useful question is
  # which platforms have it, and cancelling the other two answers that with a shrug.
  test:
    name: Build and test (${{ matrix.os }}, ${{ needs.changes.outputs.tier }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    # A suite whose end-to-end tests each run a whole mutation sweep takes minutes, and more on a
    # two-core runner than on a developer's machine. Windows pays for process creation on top, and
    # every one of these tests launches several. Generous, but bounded.
    #
    # The smoke tier's bound is a ceiling, not its budget - the budget is the few minutes the header
    # gives, and this only stops a run that has left it by an order of magnitude from holding a
    # runner for an hour.
    timeout-minutes: ${{ needs.changes.outputs.tier == 'full' && 60 || 15 }}
    # Windows runners default `run:` to PowerShell, where the solution-discovery script below is not
    # a script at all. bash is present on every GitHub runner, so one shell for the job keeps the
    # three platforms running the same steps rather than three transcriptions of them.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # Discovered rather than hardcoded, for the same reason release-dryrun.yml discovers it, and
      # with the same tolerance: this repository legitimately has no solution until the branch
      # carrying the projects lands, and a workflow that failed on that state would be red for a
      # reason that is not a defect. More than one is an error - `dotnet` cannot pick between them.
      - name: Locate the solution
        id: solution
        run: |
          set -euo pipefail
          found="$(find . -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \))"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::Found $count solutions at the repository root; 'dotnet' cannot pick one."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No solution at the repository root yet; there is nothing to test."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "path=$(printf '%s' "$found" | head -n1)" >> "$GITHUB_OUTPUT"

      # -p:Configuration=Release on the restore so it evaluates the same graph the build compiles: a
      # PackageReference conditioned on Release is otherwise absent from project.assets.json.
      - name: Restore
        if: steps.solution.outputs.present == 'true'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet restore "$SOLUTION" -p:Configuration=Release

      - name: Build
        if: steps.solution.outputs.present == 'true'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # --solution, not a positional argument. The .NET 10 SDK refuses `dotnet test <solution>` with
      # "Specifying a solution for 'dotnet test' should be via '--solution'" and exits 1 before
      # running anything - which is what release.yml did until this branch, in the one workflow no
      # ordinary run exercises before a tag.
      #
      # The full tier keeps the solution as its unit, rather than naming the two projects as the
      # smoke tier does: a test project added to the solution is then in the full tier the day it
      # exists, with nobody having to remember this file.
      #
      # The command is character for character the one release.yml runs before it packs, and is kept
      # that way: the two drifting apart is how release.yml once failed on every tag while this went
      # green.
      - name: Test, every suite
        if: steps.solution.outputs.present == 'true' && needs.changes.outputs.tier == 'full'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet test --solution "$SOLUTION" -c Release --no-build

      # The unit and property tests, all of them, in both tiers. They are the cheapest regression
      # signal this repository has, and nothing in them is a candidate for leaving out.
      - name: Test, the unit and property suite
        if: steps.solution.outputs.present == 'true' && needs.changes.outputs.tier == 'smoke'
        run: dotnet test --project tests/KillMutants.Core.Tests -c Release --no-build

      # The end-to-end tests marked [Smoke], and only those. A filter that matched nothing - the
      # trait renamed in the code but not here - would otherwise be a fast, green step that ran no
      # end-to-end test at all; the testing platform already refuses a run of zero tests, and the
      # floor below refuses one that has quietly lost most of its selection too. The tier held 183
      # tests when the floor was set; it sits below that so a deliberate change to the selection
      # does not have to edit this file, and above any selection that has lost its in-process half.
      #
      # Measured when the tier was chosen, on a four-core container: these 183 tests in 1 min 19 s,
      # against 30 min 51 s for the 308 of the whole suite on the same machine. The hosted Linux
      # runner was about 1.6 times faster than that container on the full suite, and Windows about
      # twice as slow as Linux, so the budget this step is held to is one to three minutes.
      #
      # --show-slowest-tests leaves the measurement in every log, which is where the next person to
      # choose the smoke set, or to wonder why the gate got slower, will look first.
      - name: Test, the end-to-end smoke tier
        if: steps.solution.outputs.present == 'true' && needs.changes.outputs.tier == 'smoke'
        run: >-
          dotnet test --project tests/KillMutants.EndToEnd.Tests -c Release --no-build
          --filter-trait "Tier=Smoke" --minimum-expected-tests 150
          --show-slowest-tests 10

  # One check name that never changes, for branch protection to require.
  #
  # Requiring the matrix jobs directly means requiring the literal string
  # `Build and test (ubuntu-latest)`. Rename a runner image or add a platform and protection is left
  # waiting on a name nothing reports - which blocks every pull request, starting the day somebody
  # touches the matrix and not before, with an error that says nothing useful. This job is the stable
  # name; the matrix behind it is then free to move.
  #
  # `if: always()` is what makes it a gate rather than a decoration. Without it the job is *skipped*
  # when a dependency fails, and a skipped required check does not fail a pull request: protection
  # would be satisfied by a build that never happened.
  gate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflows
      - translations
      - changes
      - test
    if: always()
    steps:
      # Before the verdict, so a red gate says what it was checking as plainly as a green one. A smoke
      # pass that read as a full one is the exact dishonesty the tiers must not introduce.
      - name: Say which tier this gate stands for
        env:
          TIER: ${{ needs.changes.outputs.tier }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          {
            if [ "$CODE" = false ]; then
              echo "### Documentation only: nothing was built or tested"
            elif [ "$TIER" = full ]; then
              echo "### Full tier: every suite, on Linux, Windows and macOS"
            elif [ "$TIER" != smoke ]; then
              echo "### No tier was decided, so nothing below can be read as tested"
            else
              echo "### Smoke tier: the build, every unit and property test, and the end-to-end tests marked [Smoke]"
              echo
              echo "The rest of the end-to-end suite runs after the merge, on all three platforms."
              echo "To run it before, add the \`full-validation\` label to this pull request."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every job this gate stands for
        env:
          LINT: ${{ needs.workflows.result }}
          TRANSLATIONS: ${{ needs.translations.result }}
          DECIDE: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          set -euo pipefail

          echo "Lint the workflows:    $LINT"
          echo "Check translations:    $TRANSLATIONS"
          echo "Decide what to build:  $DECIDE (code=$CODE, tier=$TIER)"
          echo "Build and test:        $TEST"

          refuse() {
            echo "::error::$1"
            exit 1
          }

          # These three always run, so anything but success is a failure whatever its shape.
          [ "$LINT" = success ]         || refuse "Linting the workflows did not succeed."
          [ "$TRANSLATIONS" = success ] || refuse "Checking the translations did not succeed."
          [ "$DECIDE" = success ]       || refuse "Deciding what to build did not succeed."

          # A matrix job's result is 'success' only when every leg succeeded, so one red platform
          # arrives here as one red gate without this having to know how many there are.
          if [ "$TEST" = success ]; then
            exit 0
          fi

          # The one acceptable non-success, and it is narrow on purpose. 'skipped' has two causes
          # that must never be confused: a build deliberately not needed, and a build that did not
          # happen for some other reason. Only the first is a pass, and only when the job that
          # decides said so itself - which is why its own result is checked above.
          if [ "$TEST" = skipped ] && [ "$CODE" = false ]; then
            echo "Documentation only; there was nothing to build."
            exit 0
          fi

          refuse "Build and test did not succeed (result: $TEST)."

  # A red main, said where it is seen. The full tier finds after the merge what the smoke tier could
  # not see before it, and a failed run on main otherwise announces itself as a badge and an email to
  # whoever merged - both easy to miss, and the cost of missing one grows with every merge built on
  # top of it. One issue, open exactly while main's head is red, is a state anyone can watch rather
  # than an event someone has to catch.
  #
  # Pushes only: a pull request's failure is already in front of its author. The job holds the only
  # write scope in this workflow and runs no code from the repository - no checkout, only `gh` over
  # values GitHub itself supplies - so the scope never meets anything a change could put there.
  #
  # TWO RACES, AND WHY EACH IS CLOSED HERE RATHER THAN NARROWED. Runs of successive commits overlap
  # by design (see `concurrency` above), so this job meets two of them.
  #
  #   * Two red runs reading "no issue" at once would both create one: listing rather than searching
  #     removes the index lag, not the race. So every copy of this job queues on one group and never
  #     cancels another; the read and the write it decides happen with no other writer between.
  #     A group holds one running and one pending job, so a third arrival cancels the pending one.
  #     That is safe only because no copy acts on its own result alone: each one reconciles the
  #     issue with the verdict of main's head as it stands, so whichever copy runs last leaves the
  #     state right, and a cancelled copy loses at most a comment its failed run already shows.
  #   * An older commit can finish after a newer one, green or red. A green verdict closes the
  #     issue only when it is the head's. A red one is a fact about its own commit, not about main:
  #     it goes in the issue while main's head is red or still running, and when the head has
  #     already passed it opens nothing - an issue titled "main failed" over a green main would
  #     say what is not true. It stays traceable all the same, as an annotation on its own run,
  #     which is already red on its commit.
  #
  # The head's verdict is its `CI` job's conclusion, not its run's: the run's conclusion also counts
  # this job, and a failed comment is not a failed test.
  alert:
    name: Report a red main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: always() && github.event_name == 'push' && (needs.gate.result == 'success' || needs.gate.result == 'failure')
    permissions:
      issues: write
      actions: read
    concurrency:
      group: ci-report-red-main
      cancel-in-progress: false
    steps:
      - name: Reconcile the issue with main's head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.gate.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="main failed its full validation"

          # The listing API rather than search: search is indexed with a delay.
          open_issue() {
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | head -n1
          }

          # success, failure, or pending: no completed full run of that commit has a verdict yet.
          verdict_of() {
            local runs id conclusion
            runs="$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f head_sha="$1" -f event=push -f status=completed -F per_page=20 \
              --jq '.workflow_runs[].id')"
            for id in $runs; do
              conclusion="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "CI") | .conclusion')"
              case "$conclusion" in
                success|failure) echo "$conclusion"; return ;;
              esac
            done
            echo pending
          }

          # main's head and its verdict. This run is still in progress, so when it is the head its
          # verdict is read from its gate rather than from the API.
          head="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head" = "$SHA" ]; then
            verdict="$RESULT"
          else
            verdict="$(verdict_of "$head")"
          fi
          echo "This run: $SHA ($RESULT). main's head: $head ($verdict)."

          # 1. This run's own failure, said where it is true.
          if [ "$RESULT" = failure ]; then
            body="The full validation of $SHA failed: $RUN"
            open="$(open_issue)"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            elif [ "$verdict" = success ]; then
              echo "::warning::The full validation of $SHA failed, but main's head $head has already passed. No issue is opened: main is not red."
            else
              gh issue create --title "$title" --body "$body

          Every suite runs on Linux, Windows and macOS after each merge (see .github/workflows/ci.yml). This issue stays open while main's head is red and closes itself once it passes."
            fi
          fi

          # 2. The state: open exactly while main's head is red.
          open="$(open_issue)"
          case "$verdict" in
            success)
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "main's head $head passed its full validation."
              fi
              ;;
            failure)
              if [ -z "$open" ]; then
                gh issue create --title "$title" --body "The full validation of main's head $head failed.

          Every suite runs on Linux, Windows and macOS after each merge (see .github/workflows/ci.yml). This issue stays open while main's head is red and closes itself once it passes."
              fi
              ;;
            pending)
              echo "main's head has no verdict yet; its own run will reconcile the issue."
              ;;
          esac
