name: ci

# Runs the tests. That sentence should be unremarkable, and until this file existed it was not true
# of any workflow here: release-dryrun.yml builds the solution and rehearses the pack without running
# a single test, and release.yml - which does run them - only fires on a tag. A suite was therefore
# verified by whoever happened to run it locally, and by nobody else.
#
# Everything runs, slow tests included. A suite's end-to-end tests are usually where its real defects
# are found, and a CI that skipped them would be the same half-measure in a smaller size.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow publishes nothing and needs no write scope.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # Lints the workflows, this one included. It is a job in the gate rather than a workflow of its own
  # because a broken workflow is not something to discover on the run that needed it: the failure
  # modes it catches - a mistyped `runs-on`, an expression that never evaluates, an action input that
  # does not exist - all look like a green workflow that quietly did nothing.
  #
  # It runs whether or not the repository has a solution yet, since it has nothing to do with the
  # code. On a GitHub runner actionlint also shellchecks every `run:` block, which is where its first
  # finding here came from.
  workflows:
    name: Lint the workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installed from source at a pinned version rather than through a third-party action: the Go
      # module checksum database verifies what is fetched, and nothing here runs a script downloaded
      # from the internet. Runners ship Go and shellcheck; actionlint uses the latter for `run:`
      # blocks and silently skips those checks when it is absent, so it must stay installed.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint
        run: |
          set -euo pipefail
          command -v shellcheck > /dev/null || {
            echo "::error::shellcheck is not installed, so actionlint would skip every script check."
            exit 1
          }
          "$(go env GOPATH)/bin/actionlint"

  # Decides whether anything worth compiling changed, so a documentation-only pull request does not
  # spend fifteen minutes of Windows proving that Markdown still parses.
  #
  # This is a job rather than a `paths-ignore:` on the workflow, and the difference is the whole
  # design. A workflow held back by a path filter does not run, so it publishes no status at all -
  # not "skipped", nothing - and a *required* check that never reports leaves a pull request blocked
  # for good. Filtering the workflow would therefore block exactly the documentation-only pull
  # requests it was added to speed up. Filtering inside it keeps `CI` reporting on every pull
  # request, whatever it contains.
  #
  # The rule is one-sided on purpose: build unless *every* changed file is documentation. Getting it
  # wrong the safe way costs fifteen minutes; getting it wrong the other way merges code nothing
  # compiled. Only pull requests are ever held back - a push to `main` always builds, because that is
  # the branch everything else is measured against.
  changes:
    name: Decide what needs building
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history, so the merge base with the target branch is actually present.
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          build() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "$EVENT" = pull_request ] || build "Not a pull request; building."

          # Three dots: what this branch changed since it left the target, rather than every
          # difference between two commits - which would include whatever landed on main meanwhile.
          #
          # --no-renames matters more than it looks. Rename detection is on by default, and it
          # reports a rename as the destination path alone: moving src/C.cs to docs/C.md comes back
          # as just "docs/C.md", which reads as documentation, skips every platform, and passes the
          # gate - while a compiled source file has been deleted. Measured against git 2.43:
          # `--name-only` gives one path, `--name-status` gives `R100 src/C.cs docs/C.md`, and
          # `--no-renames` gives both paths, so the source file is classified and the build happens.
          changed="$(git diff --no-renames --name-only "$BASE...$HEAD")"

          [ -n "$changed" ] || build "No files changed; building anyway."

          echo "Changed files:"
          echo "$changed"

          # Anything not on this list builds, including .github/workflows and every build file.
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md) ;;
              *) build "'$file' is not documentation; building." ;;
            esac
          done <<< "$changed"

          echo "Documentation only; the build is not needed."
          echo "code=false" >> "$GITHUB_OUTPUT"

  # Runs on all three platforms, because this tool's whole claim is that a verdict describes the code
  # rather than the machine it was measured on - and until now that claim was only ever checked on
  # Linux. Two things it touches are decided by the operating system and cannot be tested anywhere
  # else: whether two paths differing in case name the same project (ProjectPaths), and how much of a
  # command line a filter may take before the suite runs unfiltered (XUnitTestRunner.FilterBudget,
  # whose 24 000 characters exist for a limit only Windows imposes). Both have unit tests that pass
  # the platform in as an argument; neither had ever met the real filesystem or the real limit.
  #
  # fail-fast is off deliberately. When a platform-specific defect exists, the useful question is
  # which platforms have it, and cancelling the other two answers that with a shrug.
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    # A suite whose end-to-end tests each run a whole mutation sweep takes minutes, and more on a
    # two-core runner than on a developer's machine. Windows pays for process creation on top, and
    # every one of these tests launches several. Generous, but bounded.
    timeout-minutes: 60
    # Windows runners default `run:` to PowerShell, where the solution-discovery script below is not
    # a script at all. bash is present on every GitHub runner, so one shell for the job keeps the
    # three platforms running the same steps rather than three transcriptions of them.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Discovered rather than hardcoded, for the same reason release-dryrun.yml discovers it, and
      # with the same tolerance: this repository legitimately has no solution until the branch
      # carrying the projects lands, and a workflow that failed on that state would be red for a
      # reason that is not a defect. More than one is an error - `dotnet` cannot pick between them.
      - name: Locate the solution
        id: solution
        run: |
          set -euo pipefail
          found="$(find . -maxdepth 1 \( -name '*.sln' -o -name '*.slnx' \))"
          count="$(printf '%s' "$found" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::Found $count solutions at the repository root; 'dotnet' cannot pick one."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No solution at the repository root yet; there is nothing to test."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "path=$(printf '%s' "$found" | head -n1)" >> "$GITHUB_OUTPUT"

      # -p:Configuration=Release on the restore so it evaluates the same graph the build compiles: a
      # PackageReference conditioned on Release is otherwise absent from project.assets.json.
      - name: Restore
        if: steps.solution.outputs.present == 'true'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet restore "$SOLUTION" -p:Configuration=Release

      - name: Build
        if: steps.solution.outputs.present == 'true'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # --solution, not a positional argument. The .NET 10 SDK refuses `dotnet test <solution>` with
      # "Specifying a solution for 'dotnet test' should be via '--solution'" and exits 1 before
      # running anything - which is what release.yml did until this branch, in the one workflow no
      # ordinary run exercises before a tag.
      - name: Test
        if: steps.solution.outputs.present == 'true'
        env:
          SOLUTION: ${{ steps.solution.outputs.path }}
        run: dotnet test --solution "$SOLUTION" -c Release --no-build

  # One check name that never changes, for branch protection to require.
  #
  # Requiring the matrix jobs directly means requiring the literal string
  # `Build and test (ubuntu-latest)`. Rename a runner image or add a platform and protection is left
  # waiting on a name nothing reports - which blocks every pull request, starting the day somebody
  # touches the matrix and not before, with an error that says nothing useful. This job is the stable
  # name; the matrix behind it is then free to move.
  #
  # `if: always()` is what makes it a gate rather than a decoration. Without it the job is *skipped*
  # when a dependency fails, and a skipped required check does not fail a pull request: protection
  # would be satisfied by a build that never happened.
  gate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - workflows
      - changes
      - test
    if: always()
    steps:
      - name: Every job this gate stands for
        env:
          LINT: ${{ needs.workflows.result }}
          DECIDE: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail

          echo "Lint the workflows:    $LINT"
          echo "Decide what to build:  $DECIDE (code=$CODE)"
          echo "Build and test:        $TEST"

          refuse() {
            echo "::error::$1"
            exit 1
          }

          # These two always run, so anything but success is a failure whatever its shape.
          [ "$LINT" = success ]   || refuse "Linting the workflows did not succeed."
          [ "$DECIDE" = success ] || refuse "Deciding what to build did not succeed."

          # A matrix job's result is 'success' only when every leg succeeded, so one red platform
          # arrives here as one red gate without this having to know how many there are.
          if [ "$TEST" = success ]; then
            exit 0
          fi

          # The one acceptable non-success, and it is narrow on purpose. 'skipped' has two causes
          # that must never be confused: a build deliberately not needed, and a build that did not
          # happen for some other reason. Only the first is a pass, and only when the job that
          # decides said so itself - which is why its own result is checked above.
          if [ "$TEST" = skipped ] && [ "$CODE" = false ]; then
            echo "Documentation only; there was nothing to build."
            exit 0
          fi

          refuse "Build and test did not succeed (result: $TEST)."
